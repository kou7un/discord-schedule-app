<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord 予定管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ==========================================
    // ★ ここだけ自分の情報に書き換えてください ★
    // ==========================================
    const CONFIG = {
      CLIENT_ID: '1570627417616420985',
      GAS_URL: 'https://script.google.com/macros/s/AKfycbwhmsxwble0T1jWNaycZlyxOuc0pS1xoPdZ5icpB5I8F1hkwlsEw9seWd4jY_mwYZmpeQ/exec',
      GUILD_ID: '1570629644598779924',
      APP_SECRET: 'discord-schedule-2026',
      REDIRECT_URI: 'https://kou7un.github.io/discord-schedule-app/'
    };
  </script>
  <style>
    input, select, textarea { font-size: 16px !important; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-24">

  <!-- ログイン画面 -->
  <div id="login-screen" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-sm w-full shadow-xl">
      <div class="text-4xl mb-4">📅</div>
      <h1 class="text-2xl font-bold mb-2">Discord 予定管理</h1>
      <p class="text-slate-400 text-sm mb-6">サーバーメンバー専用の予定共有＆自動リマインドアプリ</p>
      <button onclick="startLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-bold py-3.5 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">
        <span>Discordでログイン</span>
      </button>
    </div>
  </div>

  <!-- メイン画面 -->
  <div id="app-screen" class="hidden max-w-2xl mx-auto">
    <header class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img id="user-avatar" src="" alt="" class="w-8 h-8 rounded-full bg-slate-700" />
        <div>
          <div id="user-name" class="text-sm font-bold leading-tight"></div>
          <div class="text-[11px] text-emerald-400">● サーバー認証済み</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchData()" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-lg text-xs" title="更新">🔄 更新</button>
        <button onclick="logout()" class="p-2 text-slate-400 hover:text-rose-400 text-xs">ログアウト</button>
      </div>
    </header>

    <div id="loading-bar" class="hidden bg-indigo-600 text-white text-xs text-center py-1 animate-pulse">
      データを同期中...
    </div>

    <div id="error-box" class="hidden m-4 p-4 bg-rose-950/80 border border-rose-700 rounded-xl text-rose-200 text-sm"></div>

    <div class="px-4 pt-4">
      <div class="grid grid-cols-3 bg-slate-800 p-1 rounded-xl text-sm font-medium">
        <button id="tab-list" onclick="switchTab('list')" class="py-2 rounded-lg bg-indigo-600 text-white transition">📋 予定一覧</button>
        <button id="tab-cal" onclick="switchTab('cal')" class="py-2 rounded-lg text-slate-400 transition">🗓️ カレンダー</button>
        <button id="tab-rules" onclick="switchTab('rules')" class="py-2 rounded-lg text-slate-400 transition">🔔 通知設定</button>
      </div>
    </div>

    <div id="filter-bar" class="px-4 pt-3 flex gap-2 text-xs">
      <button onclick="setFilter('all')" id="flt-all" class="px-3 py-1.5 rounded-full bg-slate-700 text-white font-bold">すべて</button>
      <button onclick="setFilter('全体')" id="flt-全体" class="px-3 py-1.5 rounded-full bg-slate-800 text-slate-400">📢 全体予定</button>
      <button onclick="setFilter('個人')" id="flt-個人" class="px-3 py-1.5 rounded-full bg-slate-800 text-slate-400">🔒 個人予定</button>
    </div>

    <main id="view-list" class="p-4 space-y-3"></main>

    <section id="view-cal" class="hidden p-4">
      <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <button onclick="changeMonth(-1)" class="px-3 py-1 bg-slate-700 rounded-lg">◀</button>
          <h2 id="cal-title" class="font-bold text-lg"></h2>
          <button onclick="changeMonth(1)" class="px-3 py-1 bg-slate-700 rounded-lg">▶</button>
        </div>
        <div class="calendar-grid text-center text-xs text-slate-400 mb-2">
          <div class="text-rose-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-sky-400">土</div>
        </div>
        <div id="cal-days" class="calendar-grid gap-1 text-center text-sm"></div>
      </div>
      <div id="cal-selected-list" class="mt-4 space-y-2"></div>
    </section>

    <section id="view-rules" class="hidden p-4 space-y-3">
      <div class="bg-slate-800/70 border border-slate-700 rounded-xl p-4 text-xs text-slate-300 leading-relaxed">
        カテゴリごとに「何日前の何時にDiscordへ自動通知するか」が設定されています。変更したい場合はスプレッドシートの「通知ルール」シートを編集してください。
      </div>
      <div id="rules-list" class="space-y-2
