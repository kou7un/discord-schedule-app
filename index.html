  <div id="add-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-xs z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">

        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
      </div>
      <form id="add-form" onsubmit="submitSchedule(event)" class="space-y-4">

          <label class="block text-xs text-slate-400 mb-1.5">公開範囲・通知先</label>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="cursor-pointer"><input type="radio" name="type" value="全体" checked class="peer hidden" /><div class="peer-checked:bg-indigo-600 peer-checked:border-indigo-400 peer-checked:text-white text-slate-300 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-center text-sm font-bold transition">📢 全体（チャンネル）</div></label>
            <label class="cursor-pointer"><input type="radio" name="type" value="個人" class="peer hidden" /><div class="peer-checked:bg-emerald-600 peer-checked:border-emerald-400 peer-checked:text-white text-slate-300 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-center text-sm font-bold transition">🔒 個人（DM）</div></label>
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

            <label class="block text-xs text-slate-400 mb-1">カテゴリ</label>

            <label class="block text-xs text-slate-400 mb-1">時間（任意・直前通知用）</label>
            <input id="inp-time" type="time" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" />
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">タイトル *</label>
          <input id="inp-title" type="text" required placeholder="例：数学ワーク提出 / 英語小テスト" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs text-slate-400">日付 *</label>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="setQuickDate(0)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded-lg">今日</button>
              <button type="button" onclick="setQuickDate(1)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded-lg">明日</button>
              <button type="button" onclick="setQuickDate(7)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded-lg">1週間後</button>
              <button type="button" id="add-date-btn" onclick="addDateInput()" class="text-[11px] text-indigo-400 font-bold pl-1">＋複数日</button>
            </div>
          </div>
          <div id="date-inputs" class="space-y-2"><input type="date" required class="inp-date w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" /></div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">範囲・持ち物（任意）</label>
          <input id="inp-scope" type="text" placeholder="例：P.24〜31、関数電卓" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">メモ（任意）</label>
          <textarea id="inp-memo" rows="2" placeholder="補足があれば入力" class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white"></textarea>
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] transition text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/25">登録する</button>
      </form>

  <script>
    let currentUser = null, allSchedules = [], allRules = [];
    let currentFilter = 'all', currentCatFilter = 'all', currentTab = 'list', editingScheduleId = null, showPast = false;
    let calYear = new Date().getFullYear(), calMonth = new Date().getMonth(), selectedCalDate = formatYMD(new Date());

    window.addEventListener('DOMContentLoaded', async () => {
      const hourSel = document.getElementById('rule-hour');
      for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option'); opt.value = h; opt.textContent = `${h}時頃`;
        if (h === 7) opt.selected = true;
        hourSel.appendChild(opt);
      }
      if (window.location.hash.includes('access_token=')) {
        const token = new URLSearchParams(window.location.hash.substring(1)).get('access_token');
        if (token) { localStorage.setItem('discord_token', token); history.replaceState(null, '', window.location.pathname); }
      }
      const token = localStorage.getItem('discord_token');
      if (!token) { showLogin(); return; }
      try {
        const res = await fetch('https://discord.com/api/v10/users/@me', { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('Token expired');
        const user = await res.json();
        const guildsRes = await fetch('https://discord.com/api/v10/users/@me/guilds', { headers: { Authorization: `Bearer ${token}` } });
        if (!guildsRes.ok) { localStorage.removeItem('discord_token'); showLogin(); return; }
        const guilds = await guildsRes.json();
        const isMember = guilds.some(g => g.id === CONFIG.GUILD_ID);
        currentUser = {
          id: user.id,
          name: user.global_name || user.username,
          avatar: user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png'
        };
        showApp();
        if (!isMember) { showError(`指定されたサーバーへの参加が確認できませんでした。（ID: ${CONFIG.GUILD_ID}）`); return; }
        await fetchData();
      } catch (e) { localStorage.removeItem('discord_token'); showLogin(); }
    });

    function startLogin() {
      window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${CONFIG.CLIENT_ID}&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}&response_type=token&scope=identify%20guilds`;
    }
    function logout() { localStorage.removeItem('discord_token'); location.reload(); }
    function showLogin() { document.getElementById('login-screen').classList.remove('hidden'); document.getElementById('app-screen').classList.add('hidden'); }
    function showApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-avatar').src = currentUser.avatar;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
    }

    async function fetchData() {
      setLoading(true); hideError();
      try {
        const res = await fetch(`${CONFIG.GAS_URL}?action=getData&userId=${encodeURIComponent(currentUser.id)}&token=${encodeURIComponent(CONFIG.APP_SECRET)}`);
        const data = await res.json();
        if (data.status !== 'ok') { showError(data.message || 'データの取得に失敗しました'); return; }
        allSchedules = (data.schedules || []).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
        allRules = data.rules || [];
        renderAll();
      } catch (err) { showError('通信エラーが発生しました。GASのURL設定を確認してください。'); }
      finally { setLoading(false); }
    }
    async function submitSchedule(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const isEdit = Boolean(editingScheduleId);
      btn.disabled = true; btn.textContent = '保存中...';
      const type = document.querySelector('input[name="type"]:checked').value;
      const category = document.getElementById('inp-category').value;
      const title = document.getElementById('inp-title').value.trim();
      const time = document.getElementById('inp-time').value;
      const scope = document.getElementById('inp-scope').value.trim();
      const memo = document.getElementById('inp-memo').value.trim();
      const dates = Array.from(document.querySelectorAll('.inp-date')).map(el => el.value).filter(Boolean);
      try {
        const payload = isEdit
          ? { action: 'edit', userId: currentUser.id, token: CONFIG.APP_SECRET, id: editingScheduleId, item: { type, category, title, date: dates[0], time, scope, memo } }
          : { action: 'add', userId: currentUser.id, token: CONFIG.APP_SECRET, items: dates.map(date => ({ type, category, title, date, time, scope, memo, userName: currentUser.name })) };
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.status === 'ok') {
          closeModal();
          document.getElementById('add-form').reset();
          resetDateInputs();
          await fetchData();
          showToast(isEdit ? '✅ 予定を更新しました' : '✅ 予定を追加しました');
        } else alert('保存エラー: ' + (data.message || '失敗しました'));
      } catch (err) { alert('通信エラーが発生しました'); }
      finally { btn.disabled = false; btn.textContent = isEdit ? '変更を保存する' : '登録する'; }
    }

    async function deleteSchedule(id, title) {
      if (!confirm(`「${title}」を削除しますか？`)) return;
      setLoading(true);
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'delete', userId: currentUser.id, token: CONFIG.APP_SECRET, id }) });
        const data = await res.json();
        if (data.status === 'ok') { await fetchData(); showToast('🗑️ 予定を削除しました'); }
        else alert('削除できませんでした: ' + data.message);
      } catch (err) { alert('通信エラーが発生しました'); }
      finally { setLoading(false); }
    }

    async function saveRule() {
      const category = document.getElementById('rule-cat').value.trim();
      if (!category) { alert('カテゴリ名を入力してください'); return; }
      const daysBefore = Array.from(document.querySelectorAll('.rule-day:checked')).map(el => el.value).join(',');
      const notifyHour = document.getElementById('rule-hour').value;
      const beforeMins = Array.from(document.querySelectorAll('.rule-min:checked')).map(el => el.value).join(',');
      const btn = document.getElementById('save-rule-btn'); btn.disabled = true; btn.textContent = '保存中...';
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'saveRule', userId: currentUser.id, token: CONFIG.APP_SECRET, category, daysBefore, notifyHour, beforeMins }) });
        const data = await res.json();
        if (data.status === 'ok') { closeRuleForm(); await fetchData(); showToast('🔔 通知設定を保存しました'); }
        else alert('保存エラー: ' + data.message);
      } catch (err) { alert('通信エラーが発生しました'); }
      finally { btn.disabled = false; btn.textContent = '設定を保存する'; }
    }

    async function deleteRule(category) {
      if (!confirm(`カテゴリ「${category}」を削除しますか？`)) return;
      setLoading(true);
      try {
        const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'deleteRule', userId: currentUser.id, token: CONFIG.APP_SECRET, category }) });
        const data = await res.json();
        if (data.status === 'ok') { await fetchData(); showToast('🗑️ カテゴリを削除しました'); }
        else alert('削除エラー: ' + data.message);
      } catch (err) { alert('通信エラーが発生しました'); }
      finally { setLoading(false); }
    }

    function openNewRuleForm() {
      document.getElementById('rule-form-title').textContent = '＋ 新しいカテゴリを追加';
      document.getElementById('rule-cat').value = '';
      document.getElementById('rule-hour').value = '7';
      document.querySelectorAll('.rule-day').forEach(el => { el.checked = (el.value === '0' || el.value === '1'); });
      document.querySelectorAll('.rule-min').forEach(el => { el.checked = false; });
      document.getElementById('rule-editor-card').classList.remove('hidden');
    }
    function editRule(idx) {
      const r = allRules[idx]; if (!r) return;
      document.getElementById('rule-form-title').textContent = `✏️ 「${r.category}」の通知設定`;
      document.getElementById('rule-cat').value = r.category;
      document.getElementById('rule-hour').value = r.notifyHour;
      const dList = r.daysBefore ? r.daysBefore.split(',').map(s => s.trim()) : [];
      document.querySelectorAll('.rule-day').forEach(el => { el.checked = dList.includes(el.value); });
      const mList = r.beforeMins ? r.beforeMins.split(',').map(s => s.trim()) : [];
      document.querySelectorAll('.rule-min').forEach(el => { el.checked = mList.includes(el.value); });
      document.getElementById('rule-editor-card').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function closeRuleForm() { document.getElementById('rule-editor-card').classList.add('hidden'); }
    function renderAll() { renderCategorySelect(); renderCategoryFilters(); renderList(); renderCalendar(); renderRules(); }

    function renderCategorySelect() {
      const sel = document.getElementById('inp-category');
      const cats = allRules.length ? allRules.map(r => r.category) : ['課題', 'テスト', '行事', 'バイト', '個人予定'];
      sel.innerHTML = cats.map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('');
    }

    function renderCategoryFilters() {
      const cats = ['all', ...(allRules.length ? allRules.map(r => r.category) : ['課題', 'テスト', '行事', 'バイト', '個人予定'])];
      document.getElementById('cat-filter-bar').innerHTML = cats.map(c => {
        const active = currentCatFilter === c;
        const label = c === 'all' ? '全カテゴリ' : escapeHTML(c);
        return `<button onclick="setCatFilter('${escapeHTML(c)}')" class="shrink-0 px-3 py-1.5 rounded-full border transition ${active ? 'bg-slate-200 text-slate-900 border-white font-bold' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-white'}">${label}</button>`;
      }).join('');
    }

    function getFilteredSchedules(ignoreCat = false) {
      const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
      return allSchedules.filter(s => {
        if (currentFilter !== 'all' && s.type !== currentFilter) return false;
        if (!ignoreCat && currentCatFilter !== 'all' && s.category !== currentCatFilter) return false;
        if (q) {
          const hay = `${s.title} ${s.category} ${s.scope || ''} ${s.memo || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderList() {
      const list = getFilteredSchedules();
      const todayStr = formatYMD(new Date());
      const todayMs = new Date(todayStr).getTime();

      const urgent = [], thisWeek = [], upcoming = [], past = [];
      list.forEach(item => {
        const diff = Math.round((new Date(item.date).getTime() - todayMs) / 86400000);
        if (diff < 0) past.push(item);
        else if (diff <= 1) urgent.push(item);
        else if (diff <= 7) thisWeek.push(item);
        else upcoming.push(item);
      });

      const sections = [
        { title: '🔥 今日・明日', items: urgent },
        { title: '📅 今週の予定（2〜7日後）', items: thisWeek },
        { title: '🗓️ 来週以降の予定', items: upcoming }
      ].filter(sec => sec.items.length > 0);

      const groupsEl = document.getElementById('schedule-groups');
      if (sections.length === 0 && past.length === 0) {
        groupsEl.innerHTML = `<div class="bg-slate-900/60 border border-slate-800/80 rounded-3xl p-10 text-center space-y-2"><div class="text-3xl">✨</div><div class="text-sm font-bold text-slate-300">表示する予定がありません</div><div class="text-xs text-slate-500">下の「＋」ボタンから新しい予定を追加できます</div></div>`;
      } else if (sections.length === 0) {
        groupsEl.innerHTML = `<div class="text-center text-slate-500 py-6 text-xs">今後の予定はありません</div>`;
      } else {
        groupsEl.innerHTML = sections.map(sec => `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h3 class="text-xs font-bold tracking-wider text-slate-400">${sec.title}</h3>
              <span class="text-[11px] text-slate-500">${sec.items.length}件</span>
            </div>
            <div class="space-y-2.5">${sec.items.map(createCardHTML).join('')}</div>
          </div>
        `).join('');
      }

      const pastWrap = document.getElementById('past-toggle-wrap');
      if (past.length > 0) {
        pastWrap.classList.remove('hidden');
        document.getElementById('past-toggle-label').textContent = `終了した予定（${past.length}件）`;
        document.getElementById('past-list').innerHTML = past.reverse().map(createCardHTML).join('');
      } else {
        pastWrap.classList.add('hidden');
      }
    }

    function createCardHTML(item) {
      const diff = Math.round((new Date(item.date) - new Date(formatYMD(new Date()))) / 86400000);
      const borderAccent = diff === 0 ? 'border-l-rose-500' : (item.type === '全体' ? 'border-l-indigo-500' : 'border-l-emerald-500');
      let badge = diff < 0
        ? `<span class="text-[11px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md">終了</span>`
        : diff === 0
        ? `<span class="text-[11px] bg-rose-500/20 text-rose-300 border border-rose-500/40 font-bold px-2 py-0.5 rounded-md">🔥 本日</span>`
        : diff === 1
        ? `<span class="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold px-2 py-0.5 rounded-md">⚠️ 明日</span>`
        : `<span class="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md">あと${diff}日</span>`;
      const typeBadge = item.type === '全体'
        ? `<span class="text-[11px] bg-indigo-500/15 text-indigo-300 px-2 py-0.5 rounded-md font-medium">📢 全体</span>`
        : `<span class="text-[11px] bg-emerald-500/15 text-emerald-300 px-2 py-0.5 rounded-md font-medium">🔒 個人</span>`;
      const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
      const dObj = new Date(item.date + 'T00:00:00');
      const dLabel = isNaN(dObj) ? item.date : `${item.date.slice(5).replace('-', '/')} (${dayNames[dObj.getDay()]})`;

      return `
        <div class="bg-slate-900 border border-slate-800/90 border-l-4 ${borderAccent} rounded-2xl p-4 shadow-sm hover:border-slate-700 transition">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex flex-wrap items-center gap-1.5">
              ${typeBadge}
              <span class="text-[11px] font-bold text-slate-200 bg-slate-800 px-2.5 py-0.5 rounded-md">${escapeHTML(item.category)}</span>
              ${badge}
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="openEditModal('${item.id}')" class="text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded-lg transition">✏️ 編集</button>
              <button onclick="deleteSchedule('${item.id}', '${escapeHTML(item.title)}')" class="text-slate-400 hover:text-rose-400 hover:bg-rose-950/50 text-xs px-2 py-1 rounded-lg transition">🗑️</button>
            </div>
          </div>
          <h3 class="font-bold text-base text-white leading-snug mb-1.5">${escapeHTML(item.title)}</h3>
          <div class="text-xs text-slate-400 flex flex-wrap items-center gap-x-3 gap-y-1">
            <span class="text-slate-200 font-medium">📅 ${dLabel}${item.time ? ` ⏰ ${escapeHTML(item.time)}` : ''}</span>
            ${item.type === '全体' && item.userName ? `<span>👤 ${escapeHTML(item.userName)}</span>` : ''}
          </div>
          ${item.scope ? `<div class="mt-2.5 text-xs bg-slate-950/90 text-amber-200/95 px-3 py-2 rounded-xl border border-slate-800">📖 範囲: ${escapeHTML(item.scope)}</div>` : ''}
          ${item.memo ? `<div class="mt-2 text-xs text-slate-400 leading-relaxed">💬 ${escapeHTML(item.memo)}</div>` : ''}
        </div>`;
    }
    function renderCalendar() {
      document.getElementById('cal-title').textContent = `${calYear}年 ${calMonth + 1}月`;
      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
      const list = getFilteredSchedules(true);
      const todayStr = formatYMD(new Date());
      let html = '';
      for (let i = 0; i < firstDay; i++) html += `<div></div>`;
      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayItems = list.filter(s => s.date === dateStr);
        const isSelected = dateStr === selectedCalDate, isToday = dateStr === todayStr;
        const dots = dayItems.slice(0, 4).map(s => `<span class="w-1.5 h-1.5 rounded-full ${s.type === '全体' ? 'bg-indigo-400' : 'bg-emerald-400'}"></span>`).join('');
        const preview = dayItems[0] ? `<span class="text-[9px] leading-none truncate w-full px-1 mt-0.5 ${isSelected ? 'text-indigo-100' : 'text-slate-400'}">${escapeHTML(dayItems[0].title)}</span>` : '';
        html += `<button onclick="selectCalDate('${dateStr}')" class="h-14 rounded-2xl flex flex-col items-center justify-center transition border ${isSelected ? 'bg-indigo-600 border-indigo-400 text-white font-bold shadow-md' : (isToday ? 'bg-slate-800 border-slate-600 text-white font-bold' : 'border-transparent hover:bg-slate-800/60 text-slate-300')}">
          <span class="text-xs">${d}</span>
          <div class="flex gap-0.5 mt-1 h-1.5">${dots}</div>
          ${preview}
        </button>`;
      }
      document.getElementById('cal-days').innerHTML = html;
      const selectedItems = list.filter(s => s.date === selectedCalDate);
      document.getElementById('cal-selected-title').textContent = `📅 ${selectedCalDate} の予定（${selectedItems.length}件）`;
      document.getElementById('cal-selected-list').innerHTML = selectedItems.length
        ? selectedItems.map(createCardHTML).join('')
        : `<div class="text-xs text-slate-500 p-6 bg-slate-900/60 border border-slate-800/80 rounded-2xl text-center">この日の予定はありません</div>`;
    }

    function renderRules() {
      document.getElementById('rules-list').innerHTML = allRules.map((r, idx) => {
        const daysText = r.daysBefore ? r.daysBefore.split(',').map(d => d.trim() === '0' ? '当日' : `${d.trim()}日前`).join('・') + `（${r.notifyHour}時頃）` : '日数通知なし';
        const minsText = r.beforeMins ? r.beforeMins.split(',').map(m => Number(m) >= 60 ? `${Math.floor(Number(m)/60)}時間前` : `${m.trim()}分前`).join('・') : '';
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="font-bold text-sm text-white">${escapeHTML(r.category)}</div>
              <div class="text-xs text-indigo-300">🔔 ${daysText}</div>
              ${minsText ? `<div class="text-[11px] text-amber-300/90">⏰ 直前通知: ${minsText}</div>` : ''}
            </div>
            <div class="flex gap-1.5 shrink-0">
              <button onclick="editRule(${idx})" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl font-medium">編集</button>
              <button onclick="deleteRule('${escapeHTML(r.category)}')" class="text-xs bg-rose-950/80 hover:bg-rose-900 text-rose-300 px-3 py-2 rounded-xl">削除</button>
            </div>
          </div>`;
      }).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      ['list', 'cal', 'rules'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        document.getElementById(`nav-${t}`).className = t === tab
          ? 'flex flex-col items-center gap-0.5 px-4 py-1 text-indigo-400 font-bold text-xs transition'
          : 'flex flex-col items-center gap-0.5 px-4 py-1 text-slate-400 hover:text-slate-200 text-xs transition';
      });
    }
    function setFilter(flt) {
      currentFilter = flt;
      ['all', '全体', '個人'].forEach(f => {
        document.getElementById(`flt-${f}`).className = f === flt
          ? 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition'
          : 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      });
      renderAll();
    }
    function setCatFilter(cat) { currentCatFilter = cat; renderCategoryFilters(); renderList(); }
    function togglePast() {
      showPast = !showPast;
      document.getElementById('past-list').classList.toggle('hidden', !showPast);
      document.getElementById('past-toggle-arrow').textContent = showPast ? '▲' : '▼';
    }
    function changeMonth(delta) { calMonth += delta; if (calMonth < 0) { calMonth = 11; calYear--; } if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }
    function selectCalDate(dateStr) { selectedCalDate = dateStr; renderCalendar(); }

    function openModal(presetDate) {
      editingScheduleId = null;
      document.getElementById('modal-title').textContent = '新しい予定を追加';
      document.getElementById('submit-btn').textContent = '登録する';
      document.getElementById('add-date-btn').classList.remove('hidden');
      document.getElementById('add-form').reset(); resetDateInputs(); renderCategorySelect();
      document.querySelector('.inp-date').value = presetDate || selectedCalDate;
      document.getElementById('add-modal').classList.remove('hidden');
    }
    function openEditModal(id) {
      const item = allSchedules.find(s => String(s.id) === String(id)); if (!item) return;
      editingScheduleId = id;
      document.getElementById('modal-title').textContent = '予定を編集';
      document.getElementById('submit-btn').textContent = '変更を保存する';
      document.getElementById('add-date-btn').classList.add('hidden');
      const radio = document.querySelector(`input[name="type"][value="${item.type}"]`); if (radio) radio.checked = true;
      const catSel = document.getElementById('inp-category');
      if (!Array.from(catSel.options).some(o => o.value === item.category)) {
        const opt = document.createElement('option'); opt.value = item.category; opt.textContent = item.category; catSel.appendChild(opt);
      }
      catSel.value = item.category;
      document.getElementById('inp-title').value = item.title || '';
      resetDateInputs(); document.querySelector('.inp-date').value = item.date || '';
      const t = String(item.time || '').trim();
      document.getElementById('inp-time').value = (t && t.length === 4) ? '0' + t : t;
      document.getElementById('inp-scope').value = item.scope || '';
      document.getElementById('inp-memo').value = item.memo || '';
      document.getElementById('add-modal').classList.remove('hidden');
    }
    function closeModal() { editingScheduleId = null; document.getElementById('add-modal').classList.add('hidden'); }
    function setQuickDate(offsetDays) {
      const d = new Date(); d.setDate(d.getDate() + offsetDays);
      const first = document.querySelector('.inp-date'); if (first) first.value = formatYMD(d);
    }
    function addDateInput() {
      const div = document.createElement('div'); div.className = 'flex gap-2';
      div.innerHTML = `<input type="date" required class="inp-date flex-1 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" /><button type="button" onclick="this.parentElement.remove()" class="px-3.5 bg-slate-800 rounded-2xl text-slate-300">✕</button>`;
      document.getElementById('date-inputs').appendChild(div);
    }
    function resetDateInputs() { document.getElementById('date-inputs').innerHTML = `<input type="date" required class="inp-date w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-white" />`; }
    function setLoading(flag) { document.getElementById('loading-bar').classList.toggle('hidden', !flag); }
    function showError(msg) { const b = document.getElementById('error-box'); b.textContent = msg; b.classList.remove('hidden'); }
    function hideError() { document.getElementById('error-box').classList.add('hidden'); }
    function formatYMD(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function escapeHTML(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  </script>
</body>
</html>
